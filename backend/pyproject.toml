[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "recoverai-backend"
version = "0.1.0"
description = "RecoverAI – Autonomous Revenue Recovery Intelligence Platform"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.13.0",
    "aiosqlite>=0.20.0",          # SQLite async driver (dev/demo)
    "asyncpg>=0.30.0",            # PostgreSQL async driver (prod)
    # Config
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.0",
    # ML
    "scikit-learn>=1.5.0",
    "imbalanced-learn>=0.12.0",   # SMOTE
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "joblib>=1.4.0",
    # Razorpay
    "razorpay>=1.4.0",
    # Dev/test
    "httpx>=0.27.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "rich>=13.9.0",               # Pretty CLI output
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests"]
